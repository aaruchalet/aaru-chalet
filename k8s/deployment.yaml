apiVersion: apps/v1
kind: Deployment

metadata:
  name: chalet-core-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: chalet-core

  template:
    metadata:
      labels:
        app: chalet-core

    spec:
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.4
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h chalet-core-mysql-service -uroot -proot --silent; do
                echo "Waiting for MySQL..."
                sleep 2
              done

      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: chalet-core-container
          image: 712532372065.dkr.ecr.ap-south-1.amazonaws.com/chalet-core:1.0.5
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: chalet-core-config

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
