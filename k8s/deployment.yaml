apiVersion: apps/v1
kind: Deployment

metadata:
  name: aaru-chalet-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: aaru-chalet

  template:
    metadata:
      labels:
        app: aaru-chalet

    spec:
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.4
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h aaru-chalet-mysql-service -uroot -proot --silent; do
                echo "Waiting for MySQL..."
                sleep 2
              done

      containers:
        - name: aaru-chalet-container
          image: aaru-chalet:1.0.4
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: aaru-chalet-config

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
