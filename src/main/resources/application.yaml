spring:
  application:
    name: chalet_db

  datasource:
    username: root
    password: root

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.flywaydb: DEBUG

server:
  port: 8085